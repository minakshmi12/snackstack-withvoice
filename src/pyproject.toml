[project]
name = "snackstack-voice-agent"
version = "0.1.0"
description = "Multiagent Rag based voice system for food delivery assistannt"
requires-python = ">=3.11"
dependencies = [
    # Core AI
    "openai>=1.40",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    # RAG
    "chromadb>=0.5",
    "langchain-chroma>=0.2",
    # VOICE I/O
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "numpy>=1.26",
    # Email (optional - escalation emails)
    "resend>=2.0",
    # Config
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    


]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "data*", "tools*", "voice*"]

[dependency-groups]
dev-dependencies = [
    "pytest>=8.0"
]
